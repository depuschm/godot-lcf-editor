name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            godot: Godot_v4.5.1-stable_win64_console.exe
            godot_zip: Godot_v4.5.1-stable_win64.exe.zip
          - name: Linux
            os: ubuntu-24.04
            godot: Godot_v4.5.1-stable_linux.x86_64
            godot_zip: Godot_v4.5.1-stable_linux.x86_64.zip
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install ICU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libicu-dev

      - name: Cache build folder
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('.gitmodules', 'extension/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('.gitmodules', 'extension/CMakeLists.txt') }}-

      - name: Configure
        run: cmake -S extension -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSLf -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${{ matrix.godot_zip }}"
          mkdir -p ../godot && unzip -q godot.zip -d ../godot && rm godot.zip
          chmod +x "../godot/${{ matrix.godot }}" || true

      - name: Import project
        # The very first headless import of a project with a GDExtension can abort
        # (godot-cpp's own example does the same); the second one works.
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --import || true
          "../godot/${{ matrix.godot }}" --headless --path . --import

      - name: Smoke test
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_load_demo.gd | tee smoke.log
          if grep -q "SCRIPT ERROR" smoke.log; then echo "::error::Script errors in smoke.log"; exit 1; fi
          echo "::notice title=Smoke test (${{ matrix.name }})::$(grep -cE '^- |^  ' smoke.log) map lines, result: $(tail -n 1 smoke.log)"

      - name: Round-trip test (demo)
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_roundtrip.gd | tee roundtrip.log
          if grep -q "SCRIPT ERROR" roundtrip.log; then echo "::error::Script errors in roundtrip.log"; exit 1; fi
          echo "::notice title=Round trip demo (${{ matrix.name }})::$(grep -c '  ok ' roundtrip.log) checks ok, result: $(tail -n 1 roundtrip.log)"

      - name: Event command tests (demo)
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_commands.gd | tee commands.log
          if grep -q "SCRIPT ERROR" commands.log; then echo "::error::Script errors in commands.log"; exit 1; fi
          echo "::notice title=Event commands (${{ matrix.name }})::$(grep -c '  ok ' commands.log) checks ok, result: $(tail -n 1 commands.log)"

      - name: Plugin API test
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_plugin_api.gd | tee plugin.log
          if grep -q "SCRIPT ERROR" plugin.log; then echo "::error::Script errors in plugin.log"; exit 1; fi
          echo "::notice title=Plugin API (${{ matrix.name }})::$(grep -c '  ok ' plugin.log) checks ok, result: $(tail -n 1 plugin.log)"

      - name: Test Play test
        run: |
          # Starts a shell script in place of EasyRPG Player on Linux; on Windows only
          # the command line and EasyRPG.ini parts run.
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_test_play.gd | tee testplay.log
          if grep -q "SCRIPT ERROR" testplay.log; then echo "::error::Script errors in testplay.log"; exit 1; fi
          echo "::notice title=Test Play (${{ matrix.name }})::$(grep -c '  ok ' testplay.log) checks ok, result: $(tail -n 1 testplay.log)"

      - name: Event editor test
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_event_editor.gd | tee events.log
          if grep -q "SCRIPT ERROR" events.log; then echo "::error::Script errors in events.log"; exit 1; fi
          echo "::notice title=Event editor (${{ matrix.name }})::$(grep -c '  ok ' events.log) checks ok, result: $(tail -n 1 events.log)"

      - name: Pixel movement plugin test
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_pixel_movement.gd | tee pixel.log
          if grep -q "SCRIPT ERROR" pixel.log; then echo "::error::Script errors in pixel.log"; exit 1; fi
          echo "::notice title=Pixel movement plugin (${{ matrix.name }})::$(grep -c '  ok ' pixel.log) checks ok, result: $(tail -n 1 pixel.log)"

      - name: Screen shader plugin test
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_screen_shaders.gd | tee shaders.log
          if grep -q "SCRIPT ERROR" shaders.log; then echo "::error::Script errors in shaders.log"; exit 1; fi
          echo "::notice title=Screen shader plugin (${{ matrix.name }})::$(grep -c '  ok ' shaders.log) checks ok, result: $(tail -n 1 shaders.log)"

      - name: Install EasyRPG Player libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libsdl2-dev libpixman-1-dev libpng-dev libfmt-dev libfreetype-dev \
            libharfbuzz-dev nlohmann-json3-dev libinih-dev libexpat1-dev xvfb libgl1-mesa-dri

      - name: Cache patched EasyRPG Player (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: runtime/easyrpg-player/build
          key: player-${{ runner.os }}-${{ hashFiles('runtime/easyrpg-player/*.patch', 'runtime/easyrpg-player/build.sh') }}

      - name: Build patched EasyRPG Player (Linux)
        if: runner.os == 'Linux'
        run: |
          PLAYER_CMAKE_ARGS="-DPLAYER_AUDIO_BACKEND=OFF" runtime/easyrpg-player/build.sh > player-path.txt
          echo "PATCHED_PLAYER=$(tail -n 1 player-path.txt)" >> "$GITHUB_ENV"

      - name: Pixel movement runtime test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_pixel_runtime.gd -- "$PATCHED_PLAYER" | tee runtime.log
          if grep -q "SCRIPT ERROR" runtime.log; then echo "::error::Script errors in runtime.log"; exit 1; fi
          echo "::notice title=Pixel movement in EasyRPG Player (${{ matrix.name }})::$(grep -c '  ok ' runtime.log) checks ok, result: $(tail -n 1 runtime.log)"

      - name: Screen shader preview test (Linux)
        if: runner.os == 'Linux'
        run: |
          # Not headless: renders the editor's shader preview with OpenGL (Mesa) under Xvfb.
          xvfb-run -a "../godot/${{ matrix.godot }}" --path . --rendering-driver opengl3 --script res://tests/test_screen_shaders.gd 2>&1 | tee preview.log
          if grep -q "SCRIPT ERROR" preview.log; then echo "::error::Script errors in preview.log"; exit 1; fi
          grep -q "the sepia preview tints the map" preview.log
          echo "::notice title=Screen shader preview (${{ matrix.name }})::$(grep -c '  ok ' preview.log) checks ok, result: $(tail -n 1 preview.log)"

      - name: Screen shader runtime test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_shader_runtime.gd -- "$PATCHED_PLAYER" | tee shader-runtime.log
          if grep -q "SCRIPT ERROR" shader-runtime.log; then echo "::error::Script errors in shader-runtime.log"; exit 1; fi
          echo "::notice title=Screen shaders in EasyRPG Player (${{ matrix.name }})::$(grep -c '  ok ' shader-runtime.log) checks ok, result: $(tail -n 1 shader-runtime.log)"

      - name: Round-trip test (EasyRPG TestGame)
        run: |
          git clone --depth 1 https://github.com/EasyRPG/TestGame ../TestGame
          for game in 2000 2003 Maniac; do
            echo "::group::TestGame-$game"
            # pwd -W gives a Windows path under Git Bash; plain pwd elsewhere.
            dir="$(cd ../TestGame/TestGame-$game && (pwd -W 2>/dev/null || pwd))"
            "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_roundtrip.gd -- "$dir" | tee game.log
            if grep -q "SCRIPT ERROR" game.log; then echo "::error::Script errors in game.log"; exit 1; fi
            "../godot/${{ matrix.godot }}" --headless --path . --script res://tests/test_commands.gd -- "$dir" | tee game-commands.log
            if grep -q "SCRIPT ERROR" game-commands.log; then echo "::error::Script errors in game-commands.log"; exit 1; fi
            echo "::endgroup::"
            echo "::notice title=Round trip TestGame-$game (${{ matrix.name }})::$(grep -c '  ok ' game.log) checks ok, $(grep -c 'note ' game.log) notes, result: $(tail -n 1 game.log)"
            echo "::notice title=Event commands TestGame-$game (${{ matrix.name }})::$(grep 'command lines written' game-commands.log | sed 's/^ *ok *//'), result: $(tail -n 1 game-commands.log)"
          done

      - name: Editor loads the plugins
        run: |
          "../godot/${{ matrix.godot }}" --headless --path . --editor --quit 2>&1 | tee editor.log
          # Godot exits with 0 even when a script fails to load; fail on that here.
          if grep -E "SCRIPT ERROR|Parse Error" editor.log; then exit 1; fi

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: lcf_editor-${{ runner.os }}
          # All plugin folders: lcf_editor/, lcf_map_notes/, lcf_pixel_movement/ and lcf_shaders/
          # (with lcf_shaders/examples/.gdignore, so Godot does not import the .glsl files).
          include-hidden-files: true
          path: |
            addons/lcf_editor
            addons/lcf_map_notes
            addons/lcf_pixel_movement
            addons/lcf_shaders

  release:
    # Runs for version tags (v0.1.0, ...) and for releases published on GitHub:
    # one addon zip with Windows and Linux binaries, attached to the release.
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine addon
        run: |
          mkdir -p addons
          cp -r artifacts/lcf_editor-Linux/lcf_editor addons/lcf_editor
          cp -r artifacts/lcf_editor-Linux/lcf_map_notes addons/lcf_map_notes
          cp -r artifacts/lcf_editor-Linux/lcf_pixel_movement addons/lcf_pixel_movement
          cp -r artifacts/lcf_editor-Linux/lcf_shaders addons/lcf_shaders
          cp artifacts/lcf_editor-Windows/lcf_editor/bin/* addons/lcf_editor/bin/
          ls -l addons/lcf_editor/bin addons/lcf_map_notes
          zip -r "lcf_editor-${GITHUB_REF_NAME}.zip" addons

      - name: Create release or attach to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="lcf_editor-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi
